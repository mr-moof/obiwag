  <text x="75" y="550" fill="#475569" font-size="10" font-weight="600">Directories (lifecycle-centric layout):</text>
  <text x="75" y="566" fill="#64748B" font-size="10">phases/ — 10 phase dirs (command.md + agent.md)</text>
  <text x="75" y="582" fill="#64748B" font-size="10">orchestration/ — /obi, /obi-auto, utilities/</text>
  <text x="75" y="598" fill="#64748B" font-size="10">hooks/ — Python lifecycle hooks + core/</text>
  <text x="75" y="614" fill="#64748B" font-size="10">skills/ — 4 skills (review, verify, vendor, swarm)</text>
  <text x="75" y="630" fill="#64748B" font-size="10">policies/ + docs/ — Workflow, patterns, vendor refs</text>
  <text x="75" y="646" fill="#64748B" font-size="10">users/ — Per-user settings.json (hooks config)</text>
  <text x="75" y="662" fill="#64748B" font-size="10">tools/ — deploy.ps1, config-guardian.ps1, bump-version.ps1</text>

  <rect x="75" y="672" width="80" height="22" rx="4" fill="#7C3AED"/>
