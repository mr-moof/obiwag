<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1270" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Arrowhead markers — matching workflow SVG style -->
    <marker id="arr-slate" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748B"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#059669"/>
    </marker>

    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <filter id="sh-lg" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.1"/>
    </filter>

    <linearGradient id="g-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="g-start" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="g-stop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="g-sync" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1270" fill="#F8FAFC"/>

  <!-- ===== HEADER ===== -->
  <rect width="1200" height="80" fill="url(#g-header)"/>
  <text x="600" y="36" text-anchor="middle" fill="white" font-size="24" font-weight="700" letter-spacing="0.5">Obi Wag — Session &amp; Infrastructure</text>
  <text x="600" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">Session Lifecycle Hooks · File Sync · Deployment Pipeline · Core Modules</text>


  <!-- ╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌ -->
  <!-- ===== SECTION 1: SESSION LIFECYCLE ===== -->
  <!-- ╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌ -->
  <rect x="30" y="100" width="1140" height="300" rx="12" fill="white" stroke="#E2E8F0" filter="url(#sh-lg)"/>
  <text x="600" y="130" text-anchor="middle" fill="#475569" font-size="12" font-weight="600" letter-spacing="2">SESSION LIFECYCLE</text>

  <!-- Session Start Hook -->
  <rect x="55" y="150" width="300" height="230" rx="8" fill="url(#g-start)" filter="url(#sh)"/>
  <text x="205" y="178" text-anchor="middle" fill="white" font-size="15" font-weight="700">session_start.py</text>
  <text x="205" y="196" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Hook: runs on every session open (5s)</text>
  <line x1="75" y1="206" x2="335" y2="206" stroke="rgba(255,255,255,0.3)"/>
  <text x="75" y="226" fill="rgba(255,255,255,0.9)" font-size="11">① Load version, output welcome banner</text>
  <text x="75" y="246" fill="rgba(255,255,255,0.9)" font-size="11">② Detect task type from user prompt</text>
  <text x="75" y="266" fill="rgba(255,255,255,0.9)" font-size="11">③ Pattern-match + inject grounding sources</text>
  <text x="75" y="286" fill="rgba(255,255,255,0.9)" font-size="11">④ RAG correction injection</text>
  <text x="75" y="306" fill="rgba(255,255,255,0.9)" font-size="11">⑤ Load calibration budget, check drift</text>
  <text x="75" y="326" fill="rgba(255,255,255,0.9)" font-size="11">⑥ Clean stale settings.local.json</text>
  <text x="75" y="346" fill="rgba(255,255,255,0.9)" font-size="11">⑦ List recent sessions + projects</text>
  <text x="75" y="366" fill="rgba(255,255,255,0.7)" font-size="10">Modules: calibration, pattern_matcher,</text>
  <text x="75" y="378" fill="rgba(255,255,255,0.7)" font-size="10">correction_retriever, drift_detector,</text>

  <!-- Arrow: start → session (dot + straight horizontal + arrowhead) -->
  <circle cx="359" cy="265" r="5" fill="#64748B"/>
  <path d="M 364 265 L 420 265" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr-slate)"/>

  <!-- Active Session (center) -->
  <rect x="420" y="155" width="360" height="220" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="600" y="184" text-anchor="middle" fill="#334155" font-size="15" font-weight="700">Claude Code Session</text>
  <line x1="440" y1="194" x2="760" y2="194" stroke="#CBD5E1"/>

  <text x="448" y="218" fill="#334155" font-size="12" font-weight="600">Operating Modes</text>
  <rect x="448" y="226" width="100" height="22" rx="4" fill="#DBEAFE"/>
  <text x="498" y="242" text-anchor="middle" fill="#1D4ED8" font-size="10" font-weight="600">/obi (manual)</text>
  <rect x="556" y="226" width="140" height="22" rx="4" fill="#FEF3C7"/>
  <text x="626" y="242" text-anchor="middle" fill="#92400E" font-size="10" font-weight="600">/obi-auto (autonomous)</text>

  <text x="448" y="272" fill="#64748B" font-size="11">10-Phase Workflow executes here</text>
  <text x="448" y="292" fill="#64748B" font-size="11">pre_tool_use.py blocks Bash anti-patterns</text>
  <text x="448" y="312" fill="#64748B" font-size="11">post_tool_use.py tracks tool usage metrics</text>
  <text x="448" y="332" fill="#64748B" font-size="11">Break signals halt at any phase</text>
  <text x="448" y="352" fill="#64748B" font-size="11">State persisted to .obi/active-sessions/</text>
  <text x="448" y="370" fill="#94A3B8" font-size="10">20 commands · 15 agents · 4 skills</text>

  <!-- Arrow: session → stop (dot + straight horizontal + arrowhead) -->
  <circle cx="784" cy="265" r="5" fill="#64748B"/>
  <path d="M 789 265 L 845 265" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr-slate)"/>

  <!-- Session Stop Hook -->
  <rect x="845" y="150" width="300" height="230" rx="8" fill="url(#g-stop)" filter="url(#sh)"/>
  <text x="995" y="178" text-anchor="middle" fill="white" font-size="15" font-weight="700">stop.py</text>
  <text x="995" y="196" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Hook: runs on every session close (10s)</text>
  <line x1="865" y1="206" x2="1125" y2="206" stroke="rgba(255,255,255,0.3)"/>
  <text x="865" y="226" fill="rgba(255,255,255,0.9)" font-size="11">① Analyze transcript for corrections</text>
  <text x="865" y="246" fill="rgba(255,255,255,0.9)" font-size="11">② Generate + write session summary</text>
  <text x="865" y="266" fill="rgba(255,255,255,0.9)" font-size="11">③ Log corrections to JSONL for RAG</text>
  <text x="865" y="286" fill="rgba(255,255,255,0.9)" font-size="11">④ Update performance metrics</text>
  <text x="865" y="306" fill="rgba(255,255,255,0.9)" font-size="11">⑤ Propose calibration evolutions</text>
  <text x="865" y="326" fill="rgba(255,255,255,0.9)" font-size="11">⑥ Detect learnings → pending-learnings.json</text>
  <text x="865" y="346" fill="rgba(255,255,255,0.9)" font-size="11">⑦ Strike counter + drift check</text>
  <text x="865" y="366" fill="rgba(255,255,255,0.7)" font-size="10">Modules: learning_detector, strike_counter,</text>
  <text x="865" y="378" fill="rgba(255,255,255,0.7)" font-size="10">calibration, memory_reader, drift_detector,</text>


