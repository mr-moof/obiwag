  <!-- ===== SECTION 3: CORE HOOK MODULES ===== -->
  <!-- ╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌ -->
  <rect x="30" y="760" width="1140" height="390" rx="12" fill="white" stroke="#E2E8F0" filter="url(#sh-lg)"/>
  <text x="600" y="790" text-anchor="middle" fill="#475569" font-size="12" font-weight="600" letter-spacing="2">CORE HOOK MODULES (hooks/core/) — 13 modules</text>

  <!-- Row 1 -->
  <rect x="55" y="810" width="250" height="72" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="70" y="832" fill="#334155" font-size="11" font-weight="700">calibration.py</text>
  <text x="70" y="848" fill="#64748B" font-size="9">Load calibration.md settings</text>
  <text x="70" y="862" fill="#64748B" font-size="9">Safety toggles, verification budgets, metrics</text>

  <rect x="325" y="810" width="250" height="72" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="340" y="832" fill="#334155" font-size="11" font-weight="700">pattern_matcher.py</text>
  <text x="340" y="848" fill="#64748B" font-size="9">Match user prompt → vendor docs</text>
  <text x="340" y="862" fill="#64748B" font-size="9">Detect task type, select grounding sources</text>

  <rect x="595" y="810" width="250" height="72" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="610" y="832" fill="#334155" font-size="11" font-weight="700">learning_detector.py</text>
  <text x="610" y="848" fill="#64748B" font-size="9">Extract learnings from corrections</text>
  <text x="610" y="862" fill="#64748B" font-size="9">Gotchas, vendor knowledge, workarounds</text>

  <rect x="865" y="810" width="270" height="72" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="880" y="832" fill="#334155" font-size="11" font-weight="700">strike_counter.py</text>
  <text x="880" y="848" fill="#64748B" font-size="9">Track per-issue retry state (3-strike rule)</text>
  <text x="880" y="862" fill="#64748B" font-size="9">Persist to .obi/strike-state.json</text>

  <!-- Row 2 -->
  <rect x="55" y="896" width="250" height="72" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="70" y="918" fill="#334155" font-size="11" font-weight="700">drift_detector.py</text>
  <text x="70" y="934" fill="#64748B" font-size="9">Compare source ↔ deployed files</text>
  <text x="70" y="948" fill="#64748B" font-size="9">Report drift for /obi-collect</text>

  <rect x="325" y="896" width="250" height="72" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="340" y="918" fill="#334155" font-size="11" font-weight="700">git_sync.py</text>
  <text x="340" y="934" fill="#64748B" font-size="9">Push learnings to source repo</text>
  <text x="340" y="948" fill="#64748B" font-size="9">Direct-to-master (personal) or branch+PR</text>

  <rect x="595" y="896" width="250" height="72" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="610" y="918" fill="#334155" font-size="11" font-weight="700">memory_reader.py</text>
